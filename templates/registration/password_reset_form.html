<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Recuperar senha — Malha Fiscal</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2300D4AA'/%3E%3Ctext x='16' y='23' font-family='Inter,Arial,sans-serif' font-size='15' font-weight='900' fill='%230B1E3D' text-anchor='middle'%3EMF%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#0B1E3D;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#fff;border-radius:16px;padding:48px 40px;width:100%;max-width:420px;box-shadow:0 24px 64px rgba(0,0,0,.3)}
.logo{display:flex;align-items:center;gap:10px;margin-bottom:32px;text-decoration:none}
.logo-icon{width:38px;height:38px;background:#00D4AA;border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:800;color:#0B1E3D;font-size:14px}
.logo-text{font-size:18px;font-weight:700;color:#0B1E3D}.logo-text span{color:#00D4AA}
h1{font-size:22px;font-weight:800;color:#0B1E3D;margin-bottom:6px}
.sub{font-size:14px;color:#8898AA;margin-bottom:28px}
.field{margin-bottom:16px}
label{display:block;font-size:12px;font-weight:600;color:#0B1E3D;margin-bottom:5px}
input[type=email],input[type=password],input[type=text]{width:100%;padding:10px 14px;border:1px solid #D6E0F0;border-radius:8px;font-size:14px;font-family:inherit;outline:none;transition:.15s}
input:focus{border-color:#00D4AA;box-shadow:0 0 0 3px rgba(0,212,170,.12)}
.btn{width:100%;padding:12px;background:#00D4AA;color:#0B1E3D;border:none;border-radius:8px;font-size:15px;font-weight:700;cursor:pointer;margin-top:8px;font-family:inherit;transition:.15s}
.btn:hover{background:#00B890}
.success{background:#D1FAE5;color:#065F46;padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:16px;border:1px solid #A7F3D0}
.footer{text-align:center;margin-top:20px;font-size:13px;color:#8898AA}
a.link{color:#0B1E3D;font-weight:600}
</style>
</head>
<body>
<div class="card">
  <a href="/" class="logo"><div class="logo-icon">MF</div><div class="logo-text">Malha <span>Fiscal</span></div></a>
  <h1>Recuperar senha</h1>
  <p class="sub">Informe seu e-mail cadastrado e enviaremos um link para redefinir sua senha.</p>
  {% if error %}<div style="background:#FEE2E2;color:#B91C1C;padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:16px;border:1px solid #FECACA">{{ error }}</div>{% endif %}
  <form method="post">
    {% csrf_token %}
    <div class="field"><label>E-mail</label><input type="email" name="email" placeholder="seu@email.com" autofocus required></div>
    <button type="submit" class="btn">Enviar link de recuperação</button>
  </form>
  <p class="footer"><a href="/login/" class="link">← Voltar ao login</a></p>
</div>
</body>
</html>
