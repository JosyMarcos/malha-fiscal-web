{% extends "base_admin.html" %}
{% block title %}Minha Senha{% endblock %}
{% block page_title %}Minha Senha{% endblock %}
{% block content %}
<div style="max-width:480px">
  <div class="card">
    <div class="card-header"><span class="card-title">Alterar senha de acesso</span></div>
    <div style="padding:24px">
      {% for msg in messages %}
        <div class="alert alert-{% if msg.tags == 'error' %}error{% else %}success{% endif %}" style="margin-bottom:16px">{{ msg }}</div>
      {% endfor %}
      <form method="post">
        {% csrf_token %}
        <div class="form-group">
          <label class="form-label">Nova senha</label>
          <input type="password" name="nova_senha" class="form-control" placeholder="Mínimo 6 caracteres" required>
        </div>
        <div class="form-group" style="margin-top:16px">
          <label class="form-label">Confirmar nova senha</label>
          <input type="password" name="confirma_senha" class="form-control" placeholder="Repita a nova senha" required>
        </div>
        <button type="submit" class="btn btn-primary" style="margin-top:20px;width:100%">Salvar nova senha</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
